include:
  - ../deployctl/deployments.yaml

deployments:
  maintenance-off:
    uploads:
      - label: contest OS maintenance policy
        role: all
        local: tools/contest/maintenance.sh
        remote: /usr/local/bin/isureal-maintenance
        validate: sh -n /usr/local/bin/isureal-maintenance
        verify_required: true
    activations:
      - label: stop unrelated OS maintenance and hold Snap updates
        role: all
        script: sudo sh /usr/local/bin/isureal-maintenance apply
  initial-data-version:
    uploads:
      - label: installed initial data version
        role: owner
        local: data/initial/manifest.json
        remote: /home/isucon/isureal-initial.version.json
        verify_required: true
  transport-key:
    uploads:
      - label: authenticated router transport key
        role: app
        local: generated/isureal-transport.key
        remote: /home/isucon/isureal-transport.key
    activations:
      - label: restrict transport key
        role: app
        script: sudo chown isucon:isucon /home/isucon/isureal-transport.key && sudo chmod 600 /home/isucon/isureal-transport.key
  app:
    uploads:
      - label: application
        role: app
        local: '{var:app_dir}/'
        remote: '{var:remote_home}/{var:app_dir}/'
        delete: true
        excludes: ['node_modules', '*.pprof', 'default.pgo']
      - label: systemd unit
        role: app
        local: 'generated/systemd/{var:service}.service'
        remote: '/etc/systemd/system/{var:service}.service'
    activations:
      - label: restart application after restoring durable state
        role: app
        script: |
          set -eu
          sudo chown -R {var:isucon_user}:{var:isucon_user} {var:remote_home}/{var:app_dir}
          sudo install -d -m 0775 -o {var:isucon_user} -g {var:isucon_user} {var:access_log_dir}
          sudo systemctl daemon-reload
          sudo systemctl restart {var:service}
          sudo systemctl is-active --quiet {var:service}
        ready:
          url: http://127.0.0.1:{var:listen_port}/healthz
          timeout: 180s
  app-initialize:
    activations:
      - label: initialize authoritative Go state
        role: owner
        script: curl --fail-with-body --silent --show-error --max-time 180 -X POST http://127.0.0.1:80/api/initialize

plans:
  deploy-all:
    deployments:
      maintenance-off: {}
      roles-off: {needs: [maintenance-off]}
      sysctl: {needs: [roles-off]}
      transport-key: {needs: [roles-off]}
      static: {needs: [roles-off]}
      tls: {needs: [roles-off]}
      app: {needs: [transport-key, static, tls]}
      roles-on: {needs: [app]}
  initialize:
    deployments:
      app-initialize: {}
  initial-version:
    deployments:
      initial-data-version: {}
  maintenance:
    deployments:
      maintenance-off: {}
