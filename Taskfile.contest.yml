# Contest-specific tasks for this competition's solution.
#
# Taskfile.yml includes this file with flatten:true, so these tasks are called
# without a namespace and read the generic file's vars. Task names must not
# collide with the generic file: Go Task rejects duplicates instead of
# overriding them. The generic side reaches this file only through hook tasks
# it declares (currently build-contest-assets, prepare-initial-data, gen-contest-routing,
# setup-contest-assets and check-contest-network); a contest
# that has nothing to do defines the hook here with no commands.
version: '3'

tasks:
  deploy-maintenance:
    desc: 競技に不要なOS保守を全ホストで停止しSnap自動更新を保留
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-deployctl]
    cmds:
      - '{{.OPERATION_LOCK}} {{.DEPLOYCTL_DIR}}/deployctl apply-plan maintenance -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  check-maintenance:
    desc: OS保守の停止と競技に必要な基盤の維持を読み取り確認
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} "sudo sh /usr/local/bin/isureal-maintenance check"'

  check-contest-environment:
    desc: 公式manualのenvcheckを全ホストで実行して追試環境を確認
    cmds:
      - '{{.OPERATION_LOCK}} task check-contest-environment-hosts'

  check-contest-environment-hosts:
    # Also lock direct invocation; nested locks reuse the outer task's lock.
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: |
          echo '[{{.ITEM}}] official environment check'
          {{.OPERATION_LOCK}} {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            systemctl is-enabled --quiet isucon-register.service
            systemctl is-active --quiet isucon-register.service
            systemctl is-enabled --quiet ssh.socket
            systemctl is-active --quiet ssh.socket
            sudo /usr/local/bin/envcheck
          '

  build-contest-assets:
    desc: アプリbuildに付随する競技固有binaryをビルドする（buildのhook、既定は何もしない）

  prepare-initial-data:
    desc: 初期画像ファイルの存在と転送認証鍵を準備
    cmds:
      - python3 tools/contest/prepare.py

  gen-contest-routing:
    desc: 共通生成では扱わない競技固有の配布物を追加する（genのhook、既定は何もしない）

  setup-contest-assets:
    desc: 標準の取得対象外にある競技固有の資材を取得する（setupのhook、既定は何もしない）

  check-contest-network:
    desc: 競技固有の内部経路を読み取り確認する（check-networkのhook、既定は何もしない）

  verify-initial-data:
    desc: 提供初期データの全件参照・画像hash・manifestを検証する
    cmds:
      - 'python3 tools/contest/verify-initial-data.py'

  test-bench-analysis:
    desc: 参加者向け保存ログの日次人数・グランプリ・結果の解析を検証する
    cmds:
      - 'python3 tools/contest/test_bench_analysis.py'

  verify-public-history:
    desc: 公開入口から初期履歴と画像原本を検証
    cmds:
      - '{{.OPERATION_LOCK}} python3 tools/contest/public-contract.py history'

  capture-restart-contract:
    desc: 再起動検証用に3regionの新規状態と友達関係を保存
    cmds:
      - '{{.OPERATION_LOCK}} python3 tools/contest/public-contract.py capture'

  verify-restart-contract:
    desc: 通常再起動後の公開APIから受理済み状態を検証
    cmds:
      - '{{.OPERATION_LOCK}} python3 tools/contest/public-contract.py verify'

  deploy-initial-data:
    desc: 初回・初期データ変更時だけ転送（配置済みmanifestが同じなら省略）
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-deployctl]
    cmds:
      - task: prepare-initial-data
      - |
        {{.OPERATION_LOCK}} bash <<'BASH'
        set -eu
        expected=$(shasum -a 256 data/initial/manifest.json | cut -d ' ' -f 1)
        actual=$({{.SSH}} {{.SSH_USER}}@{{.OWNER_HOSTS}} 'sha256sum /home/isucon/isureal-initial.version.json 2>/dev/null' </dev/null | cut -d ' ' -f 1) || actual=''
        if [ "$actual" = "$expected" ]; then
          echo 'Initial dataset version already installed; transfer skipped.'
          exit 0
        fi
        {{.DEPLOYCTL_DIR}}/deployctl apply initial-data -config tools/contest/initial-deployments.yaml {{.DEPLOYCTL_COMMON}}
        {{.DEPLOYCTL_DIR}}/deployctl apply initial-data-version -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}
        BASH
